<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <script>
    document.documentElement.dataset.theme = localStorage.getItem('theme') === 'light' ? 'light' : 'dark';
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar tema">☀️ Claro</button>
  <div class="app">
  <h1 class="title" aria-label="Tetris">
    <span>T</span><span>E</span><span>T</span><span>R</span><span>I</span><span>S</span>
  </h1>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <div id="game-over-content" class="hidden">
          <div id="name-input-group" class="name-input-group hidden">
            <p class="new-record-label">¡Nuevo récord! Escribe tu nombre:</p>
            <div class="name-input-row">
              <input id="player-name" type="text" maxlength="12" placeholder="Tu nombre"
                     autocomplete="off" spellcheck="false" />
              <button id="save-record-btn" type="button">Guardar</button>
            </div>
          </div>
          <div id="overlay-records" class="records-wrap"></div>
        </div>

        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <div class="records-section">
    <div class="records-header">
      <span class="label">MEJORES PUNTUACIONES</span>
      <button id="reset-records-btn" class="btn-reset" type="button">Borrar récords</button>
    </div>
    <div id="records-table" class="records-wrap"></div>
  </div>

  </div>

  <script src="game.js"></script>
</body>
</html>
